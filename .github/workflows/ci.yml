name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Validate catalog content
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out catalog
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out pinned verification inventory
        uses: actions/checkout@v7
        with:
          repository: gomlang/verification
          ref: b4e989aacb50c8825c0aea86f7cb276d3748b39c
          path: _verification
          persist-credentials: false
      - name: Test catalog validation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check generated tables, history and inventory
        run: python3 tools/catalog.py --check --inventory _verification/ci/repositories.json

  verify:
    needs: catalog
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@b4e989aacb50c8825c0aea86f7cb276d3748b39c
    with:
      module: ecosystem
      verification-ref: b4e989aacb50c8825c0aea86f7cb276d3748b39c
